  <script> // yup line 128-164 is mostly llm generated i am sorry :(
    c = 1;    // random variables to check wether high resolution mode was turned on or off 
    d = 1; 
    var Module = {
      print: function (message) {
        var logger = document.getElementById('log');
        if (logger) {
          logger.style.whiteSpace = 'pre';      // this basically takes the ascii art printed to console by C and puts it in the div
          logger.style.lineHeight = '1.1';
          logger.style.textAlign = 'left';
          logger.textContent += message + '\n';
        }
      }
    };
    function updateSizeFromToggle() {
      const cb = document.querySelector('#accept');
      const text = document.getElementById('log');
      if (!cb.checked) {
        Module.ccall('get_size', null, ['number'], [40]);   //high resolution mode off
        text.style.fontSize = '1rem';
        c = 2;
      } else {
        Module.ccall('get_size', null, ['number'], [150]);  //high resolution mode on
        text.style.fontSize = '5px';
        d = 2;
      }
    }
    document.getElementById("Image-input").addEventListener("change", async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      document.getElementById('log').textContent = '';
      updateSizeFromToggle();
      const buffer = await file.arrayBuffer();
      Module.FS.writeFile("googoo.png", new Uint8Array(buffer));  //it takes the binary data of the image you upload and makes a new file with that binary data named as "googoo.png"
      Module.callMain();
      const getWidth = Module.cwrap('image_width', 'number', []);
      if (c > d) {    //see the variables i told you about
        $("#loll").css({  //this is high resolution mode off
        "width": (getWidth() + 4) + "ch",
        "height": "auto"
      });
      }
      else {
        $("#loll").css({    //this is high resolution mode on
        "width":  "auto",
        "height": "auto" });
      }

    });
  </script> <!--- aha, coffeescript and jquery in 2026, please dont laugh at me :c --->
